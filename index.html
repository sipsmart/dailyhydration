<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Water Intake Calculator</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(to bottom, #f0f9ff 0%, #eff6ff 40%, #ffffff 100%);
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px 72px;
  }
  .wrap {
    width: 100%;
    max-width: 960px;
    display: grid;
    gap: 24px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 768px) {
    .wrap { grid-template-columns: 1.1fr 0.9fr; }
  }
  .card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    box-shadow: 0 10px 25px -5px rgba(191,219,254,0.5), 0 8px 10px -6px rgba(191,219,254,0.4);
    border: 1px solid #dbeafe;
    padding: 32px;
  }
  .title-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .title-row .emoji { font-size: 30px; }
  h1 { font-size: 22px; font-weight: 600; color: #1e293b; margin: 0; }
  .subtitle { font-size: 14px; color: #64748b; margin: 0 0 24px; }
  .field { margin-bottom: 20px; }
  label.field-label { display: block; font-size: 14px; font-weight: 500; color: #334155; margin-bottom: 6px; }
  .weight-row { display: flex; gap: 8px; }
  input[type="number"] {
    flex: 1;
    border-radius: 12px;
    border: 1px solid #bfdbfe;
    padding: 10px 16px;
    font-size: 15px;
    color: #1e293b;
    min-width: 0;
  }
  input[type="number"]:focus { outline: none; box-shadow: 0 0 0 2px #93c5fd; }
  .unit-toggle { display: flex; border-radius: 12px; border: 1px solid #bfdbfe; overflow: hidden; flex-shrink: 0; }
  .unit-toggle button {
    padding: 10px 14px; font-size: 14px; font-weight: 500; border: none; cursor: pointer;
    background: #fff; color: #64748b;
  }
  .unit-toggle button.active { background: #3b82f6; color: #fff; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt-btn {
    border-radius: 12px; border: 1px solid #bfdbfe; background: #fff; color: #475569;
    padding: 8px 12px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .opt-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  .checkboxes { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .checkboxes label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #334155; cursor: pointer; }
  .checkboxes input { width: 16px; height: 16px; accent-color: #3b82f6; }
  .calc-btn {
    width: 100%; border: none; border-radius: 12px; background: #3b82f6; color: #fff;
    font-weight: 600; font-size: 15px; padding: 14px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(191,219,254,0.6);
  }
  .calc-btn:hover { background: #2563eb; }
  .result-card { display: flex; flex-direction: column; align-items: center; }
  .result-label { font-size: 14px; font-weight: 500; color: #64748b; align-self: flex-start; margin-bottom: 16px; }
  .bottle { position: relative; width: 96px; height: 224px; margin-bottom: 16px; }
  .bottle-body {
    position: absolute; inset: 0; border-radius: 8px 8px 24px 24px;
    border: 4px solid #93c5fd; background: #eff6ff; overflow: hidden;
  }
  .bottle-fill {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, #3b82f6, #93c5fd);
    transition: height 0.7s ease-out; height: 0%;
  }
  .bottle-cap {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    width: 40px; height: 16px; border-radius: 6px 6px 0 0;
    background: #93c5fd; border: 4px solid #93c5fd;
  }
  .liters { font-size: 36px; font-weight: 700; color: #2563eb; }
  .glasses-line { font-size: 14px; color: #64748b; margin-bottom: 24px; }
  .placeholder { font-size: 14px; color: #94a3b8; margin-bottom: 24px; text-align: center; }
  .tracker { width: 100%; border-top: 1px solid #dbeafe; padding-top: 20px; }
  .tracker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .tracker-head h3 { font-size: 14px; font-weight: 500; color: #475569; margin: 0; }
  .reset-link { font-size: 12px; color: #94a3b8; background: none; border: none; text-decoration: underline; cursor: pointer; }
  .counter-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; }
  .round-btn {
    width: 36px; height: 36px; border-radius: 50%; font-weight: 700; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .round-btn.minus { border: 1px solid #bfdbfe; background: #fff; color: #3b82f6; }
  .round-btn.plus { border: none; background: #3b82f6; color: #fff; }
  .count-box { text-align: center; }
  .count-num { font-size: 24px; font-weight: 700; color: #1e293b; }
  .count-label { font-size: 12px; color: #94a3b8; }
  .add-glass-btn {
    width: 100%; border-radius: 12px; border: 1px solid #bfdbfe; background: #fff;
    color: #2563eb; font-weight: 500; padding: 10px; cursor: pointer;
  }
  .add-glass-btn:hover { background: #eff6ff; }
  .goal-pct { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 12px; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0; text-align: center;
    font-size: 12px; color: #94a3b8; padding: 12px; background: rgba(255,255,255,0.7);
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title-row">
        <span class="emoji">💧</span>
        <h1>Daily Water Intake Calculator</h1>
      </div>
      <p class="subtitle">Enter a few details to estimate how much water you should drink today.</p>

      <div class="field">
        <label class="field-label">Weight</label>
        <div class="weight-row">
          <input type="number" id="weight" min="1" inputmode="decimal" value="70" placeholder="70">
          <div class="unit-toggle">
            <button id="unit-kg" class="active" onclick="setUnit('kg')">kg</button>
            <button id="unit-lbs" onclick="setUnit('lbs')">lbs</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Activity level</label>
        <div class="grid-2" id="activity-group">
          <button class="opt-btn active" data-val="sedentary" onclick="setActivity('sedentary')">Sedentary</button>
          <button class="opt-btn" data-val="light" onclick="setActivity('light')">Light</button>
          <button class="opt-btn" data-val="moderate" onclick="setActivity('moderate')">Moderate</button>
          <button class="opt-btn" data-val="intense" onclick="setActivity('intense')">Intense</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label">Climate</label>
        <div class="grid-2" id="climate-group">
          <button class="opt-btn active" data-val="normal" onclick="setClimate('normal')">Normal</button>
          <button class="opt-btn" data-val="hot" onclick="setClimate('hot')">Hot / humid</button>
        </div>
      </div>

      <div class="checkboxes">
        <label><input type="checkbox" id="pregnant" onchange="onPregnant()"> Pregnant</label>
        <label><input type="checkbox" id="breastfeeding" onchange="onBreastfeeding()"> Breastfeeding</label>
      </div>

      <button class="calc-btn" onclick="calculate()">Calculate</button>
    </div>

    <div class="card result-card">
      <div class="result-label">Your daily goal</div>

      <div class="bottle">
        <div class="bottle-body">
          <div class="bottle-fill" id="bottle-fill"></div>
        </div>
        <div class="bottle-cap"></div>
      </div>

      <div id="result-block">
        <div class="placeholder">Fill in the form and press Calculate to see your goal.</div>
      </div>

      <div class="tracker">
        <div class="tracker-head">
          <h3>Today's tracker</h3>
          <button class="reset-link" onclick="resetLog()">reset</button>
        </div>
        <div class="counter-row">
          <button class="round-btn minus" onclick="removeGlass()" aria-label="Remove a glass">−</button>
          <div class="count-box">
            <div class="count-num" id="glass-count">0</div>
            <div class="count-label">glasses drunk</div>
          </div>
          <button class="round-btn plus" onclick="addGlass()" aria-label="Add a glass">+</button>
        </div>
        <button class="add-glass-btn" onclick="addGlass()">+ 1 glass</button>
        <div class="goal-pct" id="goal-pct"></div>
      </div>
    </div>
  </div>

  <footer>This is a general estimate, not medical advice.</footer>

<script>
  const ACTIVITY_ML = { sedentary: 0, light: 400, moderate: 700, intense: 1000 };
  const GLASS_ML = 250;
  const STORAGE_KEY = 'water-tracker-log';

  let unit = 'kg';
  let activity = 'sedentary';
  let climate = 'normal';
  let resultMl = null;
  let goalGlasses = null;
  let log = loadLog();

  function todayKey() { return new Date().toISOString().slice(0, 10); }

  function loadLog() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.date === todayKey()) return parsed;
      }
    } catch (e) {}
    return { date: todayKey(), glasses: 0 };
  }

  function saveLog() { localStorage.setItem(STORAGE_KEY, JSON.stringify(log)); }

  function setUnit(u) {
    unit = u;
    document.getElementById('unit-kg').classList.toggle('active', u === 'kg');
    document.getElementById('unit-lbs').classList.toggle('active', u === 'lbs');
  }

  function setActivity(a) {
    activity = a;
    document.querySelectorAll('#activity-group .opt-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.val === a);
    });
  }

  function setClimate(c) {
    climate = c;
    document.querySelectorAll('#climate-group .opt-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.val === c);
    });
  }

  function onPregnant() {
    if (document.getElementById('pregnant').checked) {
      document.getElementById('breastfeeding').checked = false;
    }
  }
  function onBreastfeeding() {
    if (document.getElementById('breastfeeding').checked) {
      document.getElementById('pregnant').checked = false;
    }
  }

  function calculate() {
    const raw = parseFloat(document.getElementById('weight').value);
    if (isNaN(raw) || raw <= 0) { resultMl = null; renderResult(); return; }
    const kg = unit === 'kg' ? raw : raw * 0.453592;

    let total = kg * 33;
    total += ACTIVITY_ML[activity];
    if (climate === 'hot') total += 400;
    if (document.getElementById('pregnant').checked) total += 300;
    if (document.getElementById('breastfeeding').checked) total += 750;

    resultMl = Math.round(total);
    goalGlasses = Math.round(resultMl / GLASS_ML);
    renderResult();
    renderTracker();
  }

  function renderResult() {
    const block = document.getElementById('result-block');
    if (resultMl != null) {
      const liters = (resultMl / 1000).toFixed(2);
      block.innerHTML =
        '<div class="liters">' + liters + ' L</div>' +
        '<div class="glasses-line">&asymp; ' + goalGlasses + ' glasses (' + GLASS_ML + ' ml each)</div>';
    } else {
      block.innerHTML = '<div class="placeholder">Fill in the form and press Calculate to see your goal.</div>';
    }
  }

  function refreshLogIfNewDay() {
    if (log.date !== todayKey()) log = { date: todayKey(), glasses: 0 };
  }

  function addGlass() {
    refreshLogIfNewDay();
    log.glasses += 1;
    saveLog();
    renderTracker();
  }

  function removeGlass() {
    refreshLogIfNewDay();
    log.glasses = Math.max(0, log.glasses - 1);
    saveLog();
    renderTracker();
  }

  function resetLog() {
    log = { date: todayKey(), glasses: 0 };
    saveLog();
    renderTracker();
  }

  function renderTracker() {
    document.getElementById('glass-count').textContent = log.glasses;
    let fillPercent = 0;
    if (goalGlasses) fillPercent = Math.min(100, Math.round((log.glasses / goalGlasses) * 100));
    document.getElementById('bottle-fill').style.height = fillPercent + '%';
    document.getElementById('goal-pct').textContent = goalGlasses != null ? fillPercent + "% of today's goal" : '';
  }

  renderTracker();
</script>
</body>
</html>
